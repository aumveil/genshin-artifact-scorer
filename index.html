<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="原神圣遗物配置与评分工具：保存/计算各角色圣遗物，评估新圣遗物的替换与强化价值。">
  <title>圣遗物评分</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000000'/%3E%3Cpath d='M16 6l2.4 6.1L25 13.2l-5 4.1 1.5 6.7L16 20.4l-5.5 3.6L12 17.3l-5-4.1 6.6-1.1z' fill='%23e8c46a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <!-- 外观：首屏渲染前套用已保存的选择，避免闪烁（随 js/appearance.js 一起可删） -->
  <script>
    (function () { try {
      if (localStorage.getItem("gys_appearance_v1") === "light")
        document.documentElement.setAttribute("data-appearance", "light");
    } catch (e) {} })();
  </script>
</head>
<body>
  <!-- SVG 图标库（2026-10-15 批次 2）：24 viewBox；线宽 / 颜色由 CSS `.ico` 统一（1.75px / currentColor），
       符号内仅含路径。引用方式：<svg class="ico"><use href="#i-xxx"></use></svg>。 -->
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-eval" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 21h8"/><path d="M4 7h16"/><path d="M6 7l-2.5 6.5a3 3 0 0 0 5 0L6 7Z"/><path d="M18 7l-2.5 6.5a3 3 0 0 0 5 0L18 7Z"/></symbol>
    <symbol id="i-remodel" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
    <symbol id="i-collection" viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 15v6"/><path d="M6 3h12v6a6 6 0 0 1-12 0V3Z"/><path d="M6 5H4.2a3 3 0 0 0 2.2 3"/><path d="M18 5h1.8a3 3 0 0 1-2.2 3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v10"/><path d="m8 9 4 4 4-4"/><path d="M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 13V3"/><path d="m8 7 4-4 4 4"/><path d="M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></symbol>
    <symbol id="i-config" viewBox="0 0 24 24"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 17v4"/><path d="M17 19h4"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2C12.6 7.4 16.6 11.4 22 12 16.6 12.6 12.6 16.6 12 22 11.4 16.6 7.4 12.6 2 12 7.4 11.4 11.4 7.4 12 2Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-slot-flower" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 16.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 1 1 4.5 4.5 4.5 4.5 0 1 1-4.5 4.5"/><path d="M12 7.5V9"/><path d="M7.5 12H9"/><path d="M16.5 12H15"/><path d="M12 16.5V15"/></symbol>
    <symbol id="i-slot-plume" viewBox="0 0 24 24"><path d="M12.67 19a2 2 0 0 0 1.42-.59l6.15-6.17a6 6 0 0 0-8.49-8.49L5.59 9.91A2 2 0 0 0 5 11.33V18a1 1 0 0 0 1 1Z"/><path d="M16 8 2 22"/><path d="M17.5 15H9"/></symbol>
    <symbol id="i-slot-sands" viewBox="0 0 24 24"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4a2 2 0 0 0-.6 1.4V22"/><path d="M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4a2 2 0 0 0 .6-1.4V2"/></symbol>
    <symbol id="i-slot-goblet" viewBox="0 0 24 24"><path d="M8 22h8"/><path d="M7 10h10"/><path d="M12 15v7"/><path d="M12 15a5 5 0 0 0 5-5c0-2-.5-4-2-8H9c-1.5 4-2 6-2 8a5 5 0 0 0 5 5Z"/></symbol>
    <symbol id="i-slot-circlet" viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8Z"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo" id="logoBtn" title="回到角色列表" role="button" tabindex="0" aria-label="回到角色列表">
        <span class="logo-mark" aria-hidden="true"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-spark"></use></svg></span>
        <span>圣遗物评分</span>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="btnEvaluate" title="对全部角色评估新圣遗物价值"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-eval"></use></svg>价值评估</button>
        <button class="btn" id="btnRemodel" title="判断哪些满级圣遗物更值得消耗启圣之尘重塑（算法四）"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-remodel"></use></svg>重塑分析</button>
        <button class="btn" id="btnCollection" title="查看与管理未装备圣遗物的极限单件收藏（藏品库）"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-collection"></use></svg>藏品</button>
        <button class="btn" id="btnNewRole"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-plus"></use></svg>新建角色</button>
        <!-- 「更多」菜单（2026-10-15 批次 5）：低频操作收纳（导入 / 导出） -->
        <div class="more-wrap">
          <!-- disclosure 模式（非 ARIA menu：未实现方向键导航前不用 menu 语义；Tab 可达） -->
          <button class="btn more-btn" id="btnMore" type="button" aria-expanded="false" title="更多操作"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-more"></use></svg></button>
          <div class="more-dropdown hidden" id="moreDropdown" aria-label="更多操作">
            <button class="more-item" id="btnImport" title="导入备份或外部数据"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-import"></use></svg>导入</button>
            <button class="more-item" id="btnExport" title="导出完整数据备份"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-export"></use></svg>导出</button>
          </div>
        </div>
        <!-- 外观切换（深+金 ⇄ 浅+蓝）；纯图标无文字，随 js/appearance.js 一起可删 -->
        <button class="appearance-toggle" id="appearanceToggle" type="button" aria-pressed="false" title="切换外观"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-moon"></use></svg></button>
      </div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <div id="modalRoot" class="modal-root hidden" aria-hidden="true"></div>
  <input type="file" id="importFile" accept=".json,application/json" class="hidden">

  <!-- 模块加载顺序：常量 → 校验 → 识别 → 适配器 → 存储 → IO → 算法 → 反馈 → 状态 → 视图 → 入口 -->
  <script src="js/constants.js"></script>
  <script src="js/data.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/adapters.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/io.js"></script>
  <script src="js/core.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <!-- 外观切换开关（深+金 ⇄ 浅+蓝；临时工具，选定后连同 style.css 末节与本行一起删除） -->
  <script src="js/appearance.js"></script>
</body>
</html>
